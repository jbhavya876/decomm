[package]
name = "p2p-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3.3"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
libp2p = { version = "0.56.0", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "macros"] }
methods = { version = "0.1.0", path = "../methods" }
pqcrypto-kyber = "0.8.1"
pqcrypto-traits = "0.3.5"
risc0-zkvm = { version = "3.0.5", features = ["prove", "disable-dev-mode"] }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
solana-client = "4.0.0"
solana-sdk = "4.0.1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
