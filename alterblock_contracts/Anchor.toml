[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
alterblock_contracts = "8P5tdCSpXPev51dhXRX7w7U7GvFSTc7Jfbt3c6UxyMhG"

[registry]
url = "https://api.apr.dev"

[provider]
